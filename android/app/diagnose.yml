name: Diagnose crash
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'      # আসল রিলিজড ভার্সন দিন (3.35 এখনো stable-এ নেই)
          channel: stable

      - name: Scaffold android only if missing
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.icecream
          else
            echo "android/ already exists — skipping flutter create to avoid overwrite"
          fi

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Build fat APK (x86_64 for emulator + arm64)
        run: flutter build apk --release --target-platform android-x64,android-arm64

      - name: Verify APK ABIs
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/.*/libflutter.so'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell monkey -p com.icecream.ice_cream_erp -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > logcat.txt
            adb shell pidof com.icecream.ice_cream_erp || echo "PROCESS DIED" >> logcat.txt

      - name: Show crash lines
        if: always()
        run: |
          echo "=== PROCESS DIED? ==="
          grep "PROCESS DIED" logcat.txt || echo "process alive at check time"
          echo "=== Fatal / Runtime ==="
          grep -iE "FATAL|AndroidRuntime|signal [0-9]+|backtrace" logcat.txt | head -120 || true
          echo "=== Flutter errors ==="
          grep -iE "flutter.*(error|exception|fatal)" logcat.txt | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logcat
          path: logcat.txt
