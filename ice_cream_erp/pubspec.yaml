name: ice_cream_erp
description: Offline Ice Cream Industry ERP - SAP B1 power + TallyPrime UX
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # UI & Utils
  go_router: ^14.2.0
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0

  # Reports & Export
  pdf: ^3.11.0
  excel: ^4.0.3
  share_plus: ^9.0.0
  printing: ^5.13.1

  # Charts
  fl_chart: ^0.68.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.20.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
